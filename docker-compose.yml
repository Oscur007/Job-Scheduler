x-app-env: &app-env
    REDIS_ADDR: redis:6379
    DATABASE_URL: postgres://jobuser:jobpass@postgres:5432/jobscheduler?sslmode=disable
    HTTP_ADDR: ":8080"
    UI_DIR: /app/ui
    PROCESSING_TIMEOUT: 60s

x-app-deps: &app-deps
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
    redis:
      image: redis:7-alpine
      ports:
          - "6379:6379"
      healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 5s
          timeout: 3s
          retries: 10

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: jobuser
            POSTGRES_PASSWORD: jobpass
            POSTGRES_DB: jobscheduler
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./internal/store/migrations.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U jobuser -d jobscheduler"]
            interval: 5s
            timeout: 3s
            retries: 10

    server:
        build: .
        image: job-scheduler
        command: ["/app/server"]
        environment: *app-env
        ports:
            - "8080:8080"
        depends_on: *app-deps
        restart: on-failure

    worker:
        build: .
        image: job-scheduler
        command: ["/app/worker"]
        environment: *app-env
        depends_on: *app-deps
        restart: on-failure
        deploy:
            replicas: 2

volumes:
    pgdata: